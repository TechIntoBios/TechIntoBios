@keyframes float{50%{transform:translateY(-3px)}}
@keyframes fill{to{transform:scaleX(1)}}
.t0{animation-delay:0.00s}.b0{animation-delay:0.60s}.t1{animation-delay:0.08s}.b1{animation-delay:0.68s}.t2{animation-delay:0.16s}.b2{animation-delay:0.76s}.t3{animation-delay:0.24s}.b3{animation-delay:0.84s}.t4{animation-delay:0.32s}.b4{animation-delay:0.92s}.t5{animation-delay:0.40s}.b5{animation-delay:1.00s}.t6{animation-delay:0.48s}.b6{animation-delay:1.08s}.t7{animation-delay:0.56s}.b7{animation-delay:1.16s}.t8{animation-delay:0.64s}.b8{animation-delay:1.24s}.t9{animation-delay:0.72s}.b9{animation-delay:1.32s}.f0{animation-delay:0.0s}.f1{animation-delay:0.4s}.f2{animation-delay:0.8s}.f3{animation-delay:1.2s}.f4{animation-delay:1.6s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.tile,.box,.fade,.pop{opacity:1!important}.bar{transform:none!important}.draw{stroke-dashoffset:0!important}}
